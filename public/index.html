<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exercice 4 : Cercles Rebondissants</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            text-align: center;
        }

        canvas {
            border: 2px solid #333;
            cursor: crosshair;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <h1>Canvas Interactif : Formes Géométriques</h1>
    <p>Cliquez sur la zone pour ajouter des cercles rebondissants.</p>

    <canvas id="myCanvas" width="600" height="400"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>

        const socket = io();

        var canvas = document.getElementById('myCanvas');
        var ctx = canvas.getContext('2d');

        const rect = canvas.getBoundingClientRect();


        let letters = "0123456789ABCDEF";
        function random_hex_color() {

        let color = '#';

        // Generating 6 times as HTML color code 
        // consist of 6 letter or digits
        for (let i = 0; i < 6; i++)
            color += letters[(Math.floor(Math.random() * 16))];

        return color;
                    
        }
        function gaussianRandom(mean=0, stdev=1) {
            const u = 1 - Math.random(); // Converting [0,1) to (0,1]
            const v = Math.random();
            const z = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
            // Transform to the desired mean and standard deviation:
            return z * stdev + mean;
        }


        // Tableau pour stocker tous les cercles
        var cercles = [{x:50, y:50, dx:1, dy:2, rayon:10, couleur:random_hex_color()}];

        // Fonction d'animation principale
        function animate() {    
            // Effacer complètement le canvas à chaque frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // TODO 1: Parcourir le tableau `cercles`.
            // Pour chaque cercle :
            cercles.forEach(cercle => {
                cercle.x += cercle.dx;
                cercle.y += cercle.dy;
                if(cercle.x - cercle.rayon < 0 || cercle.x+cercle.rayon > canvas.width){
                    cercle.dx = - cercle.dx;
                }
                if(cercle.y - cercle.rayon < 0 || cercle.y+cercle.rayon > canvas.height){
                    cercle.dy = - cercle.dy;
                }

                ctx.beginPath();
                ctx.arc(cercle.x, cercle.y, cercle.rayon, 0, Math.PI * 2);
                ctx.fillStyle = cercle.couleur;
                ctx.fill();

            });


            // - Mettre à jour sa position (x += dx, y += dy)
            // - Gérer les rebonds : si le cercle touche un bord (x - rayon < 0 ou x + rayon > canvas.width), inverser dx (dx = -dx).
            // - Faire de même pour le rebond vertical (y, dy, canvas.height)
            // - Dessiner le cercle (ctx.beginPath(), ctx.arc(), ctx.fillStyle, ctx.fill())

            // Boucle d'animation
            requestAnimationFrame(animate);
        }

        // Lancer l'animation
        animate();


        canvas.addEventListener('click', function (e) {
            cercle = {x:e.x-rect.left, y:e.y-rect.top, dx:gaussianRandom(0,5), dy:gaussianRandom(0,5),rayon:gaussianRandom(40,5), couleur:random_hex_color()};
            socket.emit('nouveau cercle ', cercle);
        });

        socket.on('ajoute cercles', (new_circles) => {
            new_circles.forEach((cercle)=>{cercles.push(cercle)})
        });

        // TODO 2: Ajouter un écouteur 'click' sur le canvas.
        // A chaque clic :
        // - Obtenir les coordonnées X et Y de la souris par rapport au canvas (e.clientX - rect.left).
        // - Créer un nouvel objet cercle : { x: X, y: Y, dx: vitesse_x, dy: vitesse_y, rayon: 20, couleur: '#...' }
        // - (Astuce pour des vitesses aléatoires : (Math.random() - 0.5) * 10)
        // - Ajouter cet objet au tableau `cercles`.

    </script>



</body>

</html>
