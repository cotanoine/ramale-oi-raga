<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exercice 4 : Cercles Rebondissants</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            text-align: center;
        }

        canvas {
            border: 2px solid #333;
            cursor: crosshair;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <canvas id="myCanvas" width="1000" height="1000"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>


        // Replace with your own id
        const id = 'Hop';
        let letters = "0123456789ABCDEF";
            function random_hex_color() {
            let color = '#';
            for (let i = 0; i < 6; i++)
                color += letters[(Math.floor(Math.random() * 16))];
            return color;
        }


        const socket = io();

        var canvas = document.getElementById('myCanvas');
        var ctx = canvas.getContext('2d');


        let mouse = { x: 300, y: 200 };

        // Mise à jour de la position de la souris à chaque mouvement
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect(); // ← recalcul à chaque fois
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
            socket.emit('split');
            }
        });

        const player = { x: 300, y: 200, rayon: 20, couleur: '#3498db' };
        let otherPlayers = {};
        let myId = null;

        socket.on('your:id', (id) => {
            myId = id;
        });

        let orbes = [];
        socket.on('orbes', (data) => {
            orbes = data;
        });

        // Tableau pour stocker tous les cercles
        var cercles = [{x:50, y:50, dx:1, dy:2, rayon:10, couleur:random_hex_color()}];

        // Fonction d'animation principale
        function animate() {    


            // Effacer complètement le canvas à chaque frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);


            // TODO 1: Parcourir le tableau `cercles`.
            // Pour chaque cercle :
            cercles.forEach(cercle => {

                ctx.beginPath();
                ctx.arc(cercle.x, cercle.y, cercle.rayon, 0, Math.PI * 2);
                ctx.fillStyle = cercle.couleur;
                ctx.fill();
                ctx.fillText(cercle.owner, cercle.x - 2*cercle.rayon,cercle.y - cercle.rayon);

            });

            orbes.forEach(orbe => {
                ctx.beginPath();
                ctx.arc(orbe.x, orbe.y, orbe.rayon, 0, Math.PI * 2);
                ctx.fillStyle = orbe.couleur;
                ctx.fill();
            });

            socket.emit('player:move', { x: mouse.x, y: mouse.y });

            Object.entries(otherPlayers).forEach(([id, other]) => {
                other.cellules.forEach(cellule => {
                    ctx.beginPath();
                    ctx.arc(cellule.x, cellule.y, cellule.rayon, 0, Math.PI * 2);
                    ctx.fillStyle = other.couleur;
                    ctx.fill();
                });
            });

            // - Mettre à jour sa position (x += dx, y += dy)
            // - Gérer les rebonds : si le cercle touche un bord (x - rayon < 0 ou x + rayon > canvas.width), inverser dx (dx = -dx).
            // - Faire de même pour le rebond vertical (y, dy, canvas.height)
            // - Dessiner le cercle (ctx.beginPath(), ctx.arc(), ctx.fillStyle, ctx.fill())

            // Boucle d'animation
            requestAnimationFrame(animate);
        }

        // Lancer l'animation
        animate();


        canvas.addEventListener('click', function (e) {
            //cercle = {x:e.x-rect.left, y:e.y-rect.top, dx:gaussianRandom(0,5), dy:gaussianRandom(0,5),rayon:gaussianRandom(40,5), couleur:random_hex_color()};
            const rect = canvas.getBoundingClientRect();
            socket.emit('nouveau cercle', e.x-rect.left, e.y - rect.top);
        });

        socket.on('players:update', (players) => {
            otherPlayers = players;
        });

        socket.on('positions',(circles) => {
            cercles = circles;
        })

        // TODO 2: Ajouter un écouteur 'click' sur le canvas.
        // A chaque clic :
        // - Obtenir les coordonnées X et Y de la souris par rapport au canvas (e.clientX - rect.left).
        // - Créer un nouvel objet cercle : { x: X, y: Y, dx: vitesse_x, dy: vitesse_y, rayon: 20, couleur: '#...' }
        // - (Astuce pour des vitesses aléatoires : (Math.random() - 0.5) * 10)
        // - Ajouter cet objet au tableau `cercles`.

    </script>



</body>

</html>
