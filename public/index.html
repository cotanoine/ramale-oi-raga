<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Oi.raga</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="screen-home">
        <div class="popup">
            <h1>Oi-raga</h1>
            <input id="pseudo-input" type="text" maxlength="16" placeholder="Ton pseudo..." autocomplete="off" />
            <button id="play-btn">Jouer</button>

            <div class="regles">
                <h3>Règles</h3>
                <ul>
                    <li>Souris : déplacer ta cellule</li>
                    <li>Mange les orbes pour grossir</li>
                    <li>Mange les joueurs plus petits</li>
                    <li>Espace : se diviser</li>
                    <li>Z : éjecter de la masse</li>
                </ul>
            </div>
        </div>
    </div>

    <canvas id="myCanvas"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>


        // Replace with your own id
        const id = 'Hop';
        let letters = "0123456789ABCDEF";
            function random_hex_color() {
            let color = '#';
            for (let i = 0; i < 6; i++)
                color += letters[(Math.floor(Math.random() * 16))];
            return color;
        }


        const socket = io();

        var canvas = document.getElementById('myCanvas');
        var ctx = canvas.getContext('2d');


        let mouse = { x: 300, y: 200 };

        // Mise à jour de la position de la souris à chaque mouvement
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect(); // ← recalcul à chaque fois
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
            socket.emit('split');
            }
        });

        document.addEventListener('keydown', e => {
        if (e.code === 'KeyW' || e.code === 'KeyZ') {
            socket.emit('eject');
        }
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            const pseudo = document.getElementById('pseudo-input').value.trim() || 'Anonyme';
            document.getElementById('screen-home').style.display = 'none';
            document.getElementById('myCanvas').style.display = 'block';
            socket.emit('player:join', { pseudo });
        });

        document.getElementById('pseudo-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('play-btn').click();
        });

        const player = { x: 300, y: 200, rayon: 20, couleur: '#3498db' };
        let otherPlayers = {};
        let myId = null;

        socket.on('your:id', (id) => {
            myId = id;
        });

        let orbes = [];
        socket.on('orbes', (data) => {
            orbes = data;
        });

        let leaderboard = [];
        socket.on('leaderboard', (data) => {
            leaderboard = data;
        });

        // Fonction d'animation principale
        function animate() {  
            function resize() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();  
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Récupérer les cellules du joueur local
            const moi = otherPlayers[myId];

            // Calculer le centre de masse et le zoom
            let cx   = canvas.width / 2;
            let cy   = canvas.height / 2;
            let zoom = 1;

            if (moi) {
                cx = moi.cellules.reduce((sum, c) => sum + c.x, 0) / moi.cellules.length;
                cy = moi.cellules.reduce((sum, c) => sum + c.y, 0) / moi.cellules.length;
                const rayonMax = Math.max(...moi.cellules.map(c => c.rayon));
                zoom = Math.min(1, 80 / rayonMax);
            }

            // Appliquer la transformation caméra
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-cx, -cy);

            // Dessin des orbes
            orbes.forEach(orbe => {
                ctx.beginPath();
                ctx.arc(orbe.x, orbe.y, orbe.rayon, 0, Math.PI * 2);
                ctx.fillStyle = orbe.couleur;
                ctx.fill();
            });

            // Dessin des joueurs
            Object.entries(otherPlayers).forEach(([id, other]) => {
                other.cellules.forEach(cellule => {
                    ctx.beginPath();
                    ctx.arc(cellule.x, cellule.y, cellule.rayon, 0, Math.PI * 2);
                    ctx.fillStyle = other.couleur;
                    ctx.fill();

                    const fontSize = Math.max(10, Math.min(cellule.rayon * 0.45, 22));
                    ctx.font         = `bold ${fontSize}px Arial`;
                    ctx.fillStyle    = '#fff';
                    ctx.textAlign    = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(other.pseudo || 'Anonyme', cellule.x, cellule.y);
                });
            });

            ctx.restore();
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(canvas.width - 200, 10, 190, 30 + leaderboard.length * 25);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Classement', canvas.width - 190, 18);

            leaderboard.forEach((entry, i) => {
                ctx.font = '13px Arial';
                ctx.fillStyle = i === 0 ? '#f1c40f' : '#fff';
                ctx.fillText(
                    `${i + 1}. ${entry.pseudo} (${Math.round(entry.rayon)})`,
                    canvas.width - 190,
                    45 + i * 25
                );
            });
            ctx.restore();
            
            // Envoi de la position de la souris au serveur (on convertit d'abord la position de la souris)
            const mondeX = (mouse.x - canvas.width  / 2) / zoom + cx;
            const mondeY = (mouse.y - canvas.height / 2) / zoom + cy;

            socket.emit('player:move', { x: mondeX, y: mondeY });

            // Boucle d'animation
            requestAnimationFrame(animate);
        }

        // Lancer l'animation
        animate();

        socket.on('players:update', (players) => {
            otherPlayers = players;
        });

        socket.on('dead', () => {
            document.getElementById('screen-home').style.display = 'flex';
        });

    </script>



</body>

</html>
