<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exercice 4 : Cercles Rebondissants</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            text-align: center;
        }

        canvas {
            border: 2px solid #333;
            cursor: crosshair;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <canvas id="myCanvas" width="1000" height="1000"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>


        // Replace with your own id
        const id = 'Hop';
        let letters = "0123456789ABCDEF";
            function random_hex_color() {
            let color = '#';
            for (let i = 0; i < 6; i++)
                color += letters[(Math.floor(Math.random() * 16))];
            return color;
        }


        const socket = io();

        var canvas = document.getElementById('myCanvas');
        var ctx = canvas.getContext('2d');


        let mouse = { x: 300, y: 200 };

        // Mise à jour de la position de la souris à chaque mouvement
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect(); // ← recalcul à chaque fois
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
            socket.emit('split');
            }
        });

        document.addEventListener('keydown', e => {
        if (e.code === 'KeyW' || e.code === 'KeyZ') {
            socket.emit('eject');
        }
        });
        const player = { x: 300, y: 200, rayon: 20, couleur: '#3498db' };
        let otherPlayers = {};
        let myId = null;

        socket.on('your:id', (id) => {
            myId = id;
        });

        let orbes = [];
        socket.on('orbes', (data) => {
            orbes = data;
        });

        // Tableau pour stocker tous les cercles
        var cercles = [{x:50, y:50, dx:1, dy:2, rayon:10, couleur:random_hex_color()}];

        // Fonction d'animation principale
        function animate() {    
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Récupérer les cellules du joueur local
            const moi = otherPlayers[myId];

            // Calculer le centre de masse et le zoom
            let cx   = canvas.width / 2;
            let cy   = canvas.height / 2;
            let zoom = 1;

            if (moi) {
                cx = moi.cellules.reduce((sum, c) => sum + c.x, 0) / moi.cellules.length;
                cy = moi.cellules.reduce((sum, c) => sum + c.y, 0) / moi.cellules.length;
                const rayonMax = Math.max(...moi.cellules.map(c => c.rayon));
                zoom = Math.min(1, 80 / rayonMax);
            }

            // Appliquer la transformation caméra
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-cx, -cy);

            // Dessin des cercles rebondissants
            cercles.forEach(cercle => {
                ctx.beginPath();
                ctx.arc(cercle.x, cercle.y, cercle.rayon, 0, Math.PI * 2);
                ctx.fillStyle = cercle.couleur;
                ctx.fill();
                ctx.fillText(cercle.owner, cercle.x - 2*cercle.rayon, cercle.y - cercle.rayon);
            });

            // Dessin des orbes
            orbes.forEach(orbe => {
                ctx.beginPath();
                ctx.arc(orbe.x, orbe.y, orbe.rayon, 0, Math.PI * 2);
                ctx.fillStyle = orbe.couleur;
                ctx.fill();
            });

            // Dessin des joueurs
            Object.entries(otherPlayers).forEach(([id, other]) => {
                other.cellules.forEach(cellule => {
                        ctx.beginPath();
                    ctx.arc(cellule.x, cellule.y, cellule.rayon, 0, Math.PI * 2);
                    ctx.fillStyle = other.couleur;
                    ctx.fill();
                });
            });

            ctx.restore();

            // Envoi de la position de la souris au serveur (on convertit d'abord la position de la souris)
            const mondeX = (mouse.x - canvas.width  / 2) / zoom + cx;
            const mondeY = (mouse.y - canvas.height / 2) / zoom + cy;

            socket.emit('player:move', { x: mondeX, y: mondeY });

            // Boucle d'animation
            requestAnimationFrame(animate);
        }

        // Lancer l'animation
        animate();


        canvas.addEventListener('click', function (e) {
            //cercle = {x:e.x-rect.left, y:e.y-rect.top, dx:gaussianRandom(0,5), dy:gaussianRandom(0,5),rayon:gaussianRandom(40,5), couleur:random_hex_color()};
            const rect = canvas.getBoundingClientRect();
            socket.emit('nouveau cercle', e.x-rect.left, e.y - rect.top);
        });

        socket.on('players:update', (players) => {
            otherPlayers = players;
        });

        socket.on('positions',(circles) => {
            cercles = circles;
        })

        // TODO 2: Ajouter un écouteur 'click' sur le canvas.
        // A chaque clic :
        // - Obtenir les coordonnées X et Y de la souris par rapport au canvas (e.clientX - rect.left).
        // - Créer un nouvel objet cercle : { x: X, y: Y, dx: vitesse_x, dy: vitesse_y, rayon: 20, couleur: '#...' }
        // - (Astuce pour des vitesses aléatoires : (Math.random() - 0.5) * 10)
        // - Ajouter cet objet au tableau `cercles`.

    </script>



</body>

</html>
